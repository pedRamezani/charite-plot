[tox]
skipsdist = true
envlist = py311, py312, py313, py314

[gh-actions]
python =
    3.11: py311
    3.12: py312
    3.13: py313
    3.14: py314

[testenv]
passenv = PYTHON_VERSION
# Sync into the tox env instead of the shared project .venv, so `tox -p` doesn't race.
setenv =
    UV_PROJECT_ENVIRONMENT = {envdir}
allowlist_externals = uv
commands =
    uv sync --python {envpython}
    uv run python -m pytest tests --cov --cov-report=term-missing
    uv run ty check --python {envdir}
