name: release-main

on:
  release:
    types: [published]

jobs:

  check-version:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The version lives in charite_plot/__init__.py; the release tag (e.g. v0.4.0 or 0.4.0) must match it.
      - name: Check that the release tag matches __version__
        run: |
          PKG_VERSION=$(sed -n 's/^__version__ = "\(.*\)"/\1/p' charite_plot/__init__.py)
          TAG="${GITHUB_REF#refs/tags/}"
          if [ "${TAG#v}" != "$PKG_VERSION" ]; then
            echo "::error::Release tag '$TAG' does not match __version__ '$PKG_VERSION'"
            exit 1
          fi

  publish:
    runs-on: ubuntu-latest
    needs: [check-version]
    environment:
      name: pypi
      url: https://pypi.org/p/charite-plot
    permissions:
      # PyPI trusted publishing (no API token needed)
      id-token: write
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up the environment
        uses: ./.github/actions/setup-python-env

      - name: Build package
        run: uv build

      - name: Publish package
        run: uv publish

  deploy-docs:
    needs: publish
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up the environment
        uses: ./.github/actions/setup-python-env

      - name: Build documentation
        run: uv run zensical build --clean

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
