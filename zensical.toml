[project]
site_name = "charite-plot"
site_description = "Matplotlib and Altair themes for Charité – Universitätsmedizin Berlin"
site_author = "Pedram Ramezani"
site_url = "https://pedramezani.github.io/charite-plot/"
repo_url = "https://github.com/pedramezani/charite-plot"
repo_name = "charite-plot"
edit_uri = "edit/main/docs/"

extra_css = ["stylesheets/extra.css"]
extra_javascript = ["javascripts/cvd.js"]

nav = [
    { "Home" = "index.md" },
    { "Installation" = "installation.md" },
    { "User Guide" = [
        { "Colors" = "colors.md" },
        { "Palettes" = "palettes.md" },
        { "Matplotlib" = "matplotlib.md" },
        { "Altair" = "altair.md" },
    ] },
    { "Citing" = "citing.md" },
    { "API Reference" = [
        { "colors" = "api/colors.md" },
        { "palettes" = "api/palettes.md" },
        { "mpl_themes" = "api/mpl_themes.md" },
        { "altair_themes" = "api/altair_themes.md" },
        { "fonts" = "api/fonts.md" },
        { "brand" = "api/brand.md" },
    ] },
]

[project.theme]
language = "en"
features = [
    "navigation.tabs",
    "navigation.sections",
    "navigation.top",
    "toc.follow",
    "content.code.copy",
    "content.code.annotate",
    "content.action.edit",
    "content.action.view",
    "search.highlight",
]

# Colors come from docs/stylesheets/extra.css (Charité corporate identity).
# The toggle cycles: follow the system → light → dark.
[[project.theme.palette]]
media = "(prefers-color-scheme)"
primary = "custom"
accent = "custom"
toggle.icon = "lucide/sun-moon"
toggle.name = "Switch to light mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: light)"
scheme = "default"
primary = "custom"
accent = "custom"
toggle.icon = "lucide/sun"
toggle.name = "Switch to dark mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: dark)"
scheme = "slate"
primary = "custom"
accent = "custom"
toggle.icon = "lucide/moon"
toggle.name = "Switch to system preference"

[project.theme.icon]
repo = "fontawesome/brands/github"

[[project.extra.social]]
icon = "fontawesome/brands/github"
link = "https://github.com/pedramezani/charite-plot"

[[project.extra.social]]
icon = "fontawesome/brands/python"
link = "https://pypi.org/project/charite-plot"

[project.markdown_extensions.pymdownx.highlight]
anchor_linenums = true
line_spans = "__span"
pygments_lang_class = true

[project.markdown_extensions.pymdownx.inlinehilite]

[project.markdown_extensions.pymdownx.superfences]

[project.markdown_extensions.toc]
permalink = true

[project.plugins.mkdocstrings.handlers.python]
paths = ["."]

[project.plugins.mkdocstrings.handlers.python.options]
docstring_style = "numpy"
show_source = false
show_root_heading = true
show_root_full_path = false
heading_level = 2
members_order = "source"
